services:
  db:
    image: postgres:15                   
    container_name: admin_bot_db          
    restart: always                      
    environment:                         
      POSTGRES_DB: my_database           
      POSTGRES_USER: my_user             
      POSTGRES_PASSWORD: my_password     
    volumes:
      - postgres_data:/var/lib/postgresql/data 

  app:
    build: .                              
    container_name: admin_bot           
    restart: always                      
    depends_on:
      - db                               
    environment:                         
      DB_HOST: ${DB_HOST}                        
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

volumes:
  postgres_data:
